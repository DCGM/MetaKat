[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metakat"
version = "0.1.0"
description = "Enriches an ordered batch of document pages with structured metadata"
readme = "metakat/README.md"
requires-python = ">=3.12"

# Versions are pinned to the environment MetaKat is currently running in
# (Python 3.12.13). Upgrades are deliberate and wholesale, not incremental:
# bump these together, fix the code, re-run the suite.
dependencies = [
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "natsort==8.4.0",
    "Pillow==12.3.0",
    "numpy==1.26.4",
    "opencv-python==4.8.0.76",
    "ortools==9.14.6206",
    "text-geometry-aligner",
]

[project.optional-dependencies]
# Deep-learning runtime for torch/HuggingFace model inference.
torch = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.42.4",
]

# YOLO detection (metakat/common/engines/engine_yolo.py).
# ultralytics depends on torch, so this tier is never lighter than [torch].
yolo = [
    "metakat[torch]",
    "ultralytics==8.4.70",
]

# Interactive PDF output (--output-metakat-pdf).
pdf = ["PyMuPDF==1.27.2.3"]

# Training and evaluation for metakat/page_type/nets.
train = [
    "metakat[torch]",
    "accelerate==1.14.0",
    "scikit-learn==1.3.2",
    "safe-gpu==2.0.0",
]

# DocAPI worker (metakat/worker/docapi).
worker = ["doc-api"]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Aggregates: pure composition, no packages of their own.
inference = ["metakat[yolo,pdf]"]
all = ["metakat[inference,train,worker,dev]"]

[tool.setuptools.packages.find]
include = ["metakat*"]
exclude = [
    "metakat.old_examples*",
    "metakat.chapter.xshele02*",
    "metakat*.tests",
]
# The co-located tests directories carry no __init__.py; disabling namespace
# discovery keeps them, and only them, out of the installed distribution.
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
# importlib mode lets identically-named test modules coexist at different
# levels of the package tree (several test_engine_yolo_alto.py) without
# __init__.py files.
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["metakat"]
markers = [
    "requires_torch: needs the torch/HF stack (install .[torch] or .[yolo])",
    "requires_model: needs real model weights on disk",
    "slow: excluded from the default fast run",
]

[tool.coverage.run]
source = ["metakat"]
omit = [
    "metakat/old_examples/*",
    "metakat/chapter/xshele02/*",
    "*/tests/*",
]
