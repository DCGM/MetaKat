[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metakat"
version = "0.1.0"
description = "Enriches an ordered batch of document pages with structured metadata"
readme = "metakat/README.md"
requires-python = ">=3.12"

# Versions are pinned to the environment MetaKat is currently running in
# (Python 3.12.13). Upgrades are deliberate and wholesale, not incremental:
# bump these together, fix the code, re-run the suite.
dependencies = [
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "natsort==8.4.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
# Interactive PDF output (--output-metakat-pdf): the base install plus the
# renderer, and nothing else. metakat/tools/create_interactive_pdf.py reaches
# only the schemas and the document grouping helper, so a processed batch can
# be rendered without any engine or model runtime present.
pdf = ["PyMuPDF==1.27.2.3"]

# The deep-learning runtime, declared once and shared by [inference] and
# [train], which both need it. This is an internal grouping rather than a tier
# to install on its own: nothing is usable with it alone, and no engine reports
# it as the extra to install.
torch = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.6",
]

# Everything the processing pipeline needs on top of the base IO layer: the
# detector, the OCR geometry aligner, and the numeric and solver libraries the
# engines are built from.
#
# This is deliberately one tier rather than one per engine. These are
# general-purpose building blocks -- array handling, image decoding, geometry
# alignment, constraint solving -- that any current or future engine may reach
# for, so installing the pipeline does not mean tracking which engine needs
# which library.
#
# ultralytics depends on torch, so this tier is never lighter than [torch].
inference = [
    "metakat[torch]",
    "ultralytics==8.4.70",
    "numpy==1.26.4",
    "opencv-python==4.8.0.76",
    "ortools==9.14.6206",
    "text-geometry-aligner",
]

# metakat/worker/docapi is a thin wrapper around the pipeline: the engines it
# runs, the PDF exporter it writes when STORE_METAKAT_PDF is set, and the
# DocAPI client it polls for jobs.
#
# doc-api's own worker extra keeps the API service's stack -- SQLAlchemy,
# asyncpg, alembic, uvicorn -- out of the install.
worker = [
    "metakat[inference,pdf]",
    "doc-api[worker]",
]

# Training and evaluation for metakat/page_type/nets, the dataset builders
# under metakat/page_type/datasets and datasets_from_mods, and the page text
# and image embeddings with their page-type evaluation under
# metakat/page_type/training. Those read and transform page images and texts
# directly rather than through an engine, so they name numpy and OpenCV
# themselves instead of inheriting them from [inference]. lmdb holds the page
# texts and embeddings; pandas, umap-learn and plotly build the evaluation
# report.
train = [
    "metakat[torch]",
    "accelerate==1.14.0",
    "scikit-learn==1.9.1",
    "safe-gpu==2.0.0",
    "numpy==1.26.4",
    "opencv-python==4.8.0.76",
    "lmdb==2.2.1",
    "pandas==3.0.3",
    "umap-learn==0.5.12",
    "plotly==7.1.0",
]

# FlashAttention 2 for the text embedding models, which use it by default when
# it is installed and fall back to PyTorch sdpa otherwise: it drops the padding
# of their variable-length batches (mmBERT ~1.7x faster). The DINOv2 image
# embeddings do not need it -- every image is the same 261 tokens without
# padding, where sdpa already runs PyTorch's own flash kernel at the same speed.
# The wheel is built for exactly this stack -- Linux x86_64, CPython
# 3.12, CUDA 12, torch 2.8, C++11 ABI -- so it is kept out of [all] and must
# change together with the torch pin.
flash-attn = [
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
    "einops==0.8.2",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

all = ["metakat[worker,train,dev]"]

[tool.setuptools.packages.find]
include = ["metakat*"]
exclude = [
    "metakat.old_examples*",
    "metakat.chapter.xshele02*",
    "metakat*.tests",
]
# The co-located tests directories carry no __init__.py; disabling namespace
# discovery keeps them, and only them, out of the installed distribution.
namespaces = false

[tool.pytest.ini_options]
minversion = "8.0"
# importlib mode lets identically-named test modules coexist at different
# levels of the package tree (several test_engine_yolo_alto.py) without
# __init__.py files.
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["metakat"]

[tool.coverage.run]
source = ["metakat"]
omit = [
    "metakat/old_examples/*",
    "metakat/chapter/xshele02/*",
    "*/tests/*",
]
