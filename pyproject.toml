[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metakat"
version = "0.1.0"
description = "Enriches an ordered batch of document pages with structured metadata"
readme = "metakat/README.md"
requires-python = ">=3.12"

# Versions are pinned to the environment MetaKat is currently running in
# (Python 3.12.13). Upgrades are deliberate and wholesale, not incremental:
# bump these together, fix the code, re-run the suite.
dependencies = [
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "natsort==8.4.0",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
# Visualization, with no engine or model runtime present: the interactive PDF
# output (--output-metakat-pdf, metakat/tools/create_interactive_pdf.py, which
# reaches only the schemas and the document grouping helper, so a processed
# batch can be rendered anywhere), and metakat/chapter/download_articles, which
# samples article title pages from digital libraries and shows them in a review
# window. PyMuPDF renders and reads PDFs, OpenCV and numpy show the window.
# Fetching a KNAV volume whose contents page has no ALTO also needs easyocr,
# left out here: it brings torch and its own OpenCV build.
vis = [
    "PyMuPDF==1.27.2.3",
    "numpy==1.26.4",
    "opencv-python==4.8.0.76",
]

# The deep-learning runtime used by [inference]. This is an internal grouping
# rather than a tier to install on its own: no engine reports it as the extra
# to install.
torch = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.6",
]

# Everything the processing pipeline needs on top of the base IO layer: the
# detector, the OCR geometry aligner, and the numeric and solver libraries the
# engines are built from.
#
# This is deliberately one tier rather than one per engine. These are
# general-purpose building blocks -- array handling, image decoding, geometry
# alignment, constraint solving -- that any current or future engine may reach
# for, so installing the pipeline does not mean tracking which engine needs
# which library.
#
# ultralytics depends on torch, so this tier is never lighter than [torch].
inference = [
    "metakat[torch]",
    "ultralytics==8.4.70",
    "numpy==1.26.4",
    "opencv-python==4.8.0.76",
    "ortools==9.14.6206",
    "text-geometry-aligner",
]

# metakat/worker/docapi is a thin wrapper around the pipeline: the engines it
# runs, the PDF exporter it writes when STORE_METAKAT_PDF is set (from [vis],
# whose numpy and OpenCV are the ones [inference] pins), and the DocAPI client
# it polls for jobs.
#
# doc-api's own worker extra keeps the API service's stack -- SQLAlchemy,
# asyncpg, alembic, uvicorn -- out of the install.
worker = [
    "metakat[inference,vis,vlm]",
    "doc-api[worker]",
]

# The engines that read pages with a vision-language model behind an
# OpenAI-compatible API (OpenAI, OpenRouter, vLLM), metakat/common/vlm: the
# client, JSON schema validation of the replies, and the prompt templates.
# They locate the model's values in the ALTO with the text aligner, so they
# build on [inference].
vlm = [
    "metakat[inference]",
    "openai==3.24.0",
    "jsonschema==4.26.0",
    "Jinja2==3.1.6",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

all = ["metakat[worker,dev]"]

[tool.setuptools.packages.find]
include = ["metakat*"]
exclude = [
    "metakat.old_examples*",
    "metakat.chapter.xshele02*",
    "metakat*.tests",
]
# The co-located tests directories carry no __init__.py; disabling namespace
# discovery keeps them, and only them, out of the installed distribution.
namespaces = false

# The default prompts and JSON schema the VLM engines read at run time.
[tool.setuptools.package-data]
"metakat.biblio.engines.core" = ["vlm/*.txt", "vlm/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
# importlib mode lets identically-named test modules coexist at different
# levels of the package tree (several test_engine_yolo_alto.py) without
# __init__.py files.
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["metakat"]

[tool.coverage.run]
source = ["metakat"]
omit = [
    "metakat/old_examples/*",
    "metakat/chapter/xshele02/*",
    "*/tests/*",
]
